[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2copilot"
version = "0.1.0"
description = "StarCraft 2 build creator, practice coach, and post-game analyzer driven by your own replays"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "sc2reader>=1.8.0",
    "spawningtool>=1.4.0",
]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=7.0"]

[project.scripts]
sc2copilot = "sc2copilot.cli:main"

[tool.setuptools.packages.find]
include = ["sc2copilot*"]

[tool.setuptools.package-data]
sc2copilot = ["data/builds/*.json"]
